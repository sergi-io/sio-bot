          <div id="BacktestChart" style="height: 100vh">
            <script>
              var reportConfig = ```{{reportConfigJSON}}```;
              var candles = ```{{candlesJSON}}```;
              // split the data set into ohlc and volume
              var ohlc = [],
                volume = [],
                annotations = [],
                bottomAnnotations = [],
                i = 0;

              // First pass: find max absolute PnL for color normalization
              var maxAbsPnl = 0;
              candles.forEach((candle) => {
                if (candle.annotations) {
                  candle.annotations.forEach((annotation) => {
                    var absPnl = Math.abs(parseFloat(annotation.position.realizedPnl));
                    if (absPnl > maxAbsPnl) maxAbsPnl = absPnl;
                  });
                }
              });

              // Returns a gradient color: stronger intensity for larger PnL amounts
              function getPnlColor(pnl) {
                var absPnl = Math.abs(pnl);
                // Normalize to 0.25-1.0 range (so even small trades are visible)
                var intensity = maxAbsPnl > 0 ? 0.25 + 0.75 * (absPnl / maxAbsPnl) : 0.5;
                if (pnl >= 0) {
                  // Green: rgb(0, 128, 0) at full intensity, faded toward gray
                  var g = Math.round(80 + 175 * intensity);
                  var r = Math.round(80 * (1 - intensity));
                  var b = Math.round(80 * (1 - intensity));
                  return 'rgb(' + r + ',' + g + ',' + b + ')';
                } else {
                  // Red: rgb(255, 0, 0) at full intensity, faded toward gray
                  var r = Math.round(80 + 175 * intensity);
                  var g = Math.round(80 * (1 - intensity));
                  var b = Math.round(80 * (1 - intensity));
                  return 'rgb(' + r + ',' + g + ',' + b + ')';
                }
              }

              candles.forEach((candle) => {
                ohlc.push([candle.timestamp, candle.open, candle.high, candle.low, candle.close]);
                volume.push([candle.timestamp, candle.buyVolume + candle.sellVolume]);
                if (candle.annotations) {
                  candle.annotations.forEach((annotation) => {
                    const pnl = parseFloat(annotation.position.realizedPnl);
                    const pnlFormatted = pnl.toFixed(2);

                    annotations.push({
                      x: candle.timestamp,
                      title: annotation.openOrClose,
                      text: JSON.stringify(annotation.position, null, 4)
                        .replace(/ /g, '&nbsp;')
                        .replace(/{/g, '')
                        .replace(/}/g, '')
                        .trim()
                        .replace(/\n/g, '<br>'),
                      shape: 'squarepin',
                      borderRadius: 3,
                      fillColor: annotation.position.side === 'long' ? 'green' : 'red',
                    });

                    bottomAnnotations.push({
                      x: candle.timestamp,
                      title: `${pnlFormatted > 0 ? '+' : '-'}`,
                      text: JSON.stringify(annotation.position, null, 4)
                        .replace(/ /g, '&nbsp;')
                        .replace(/{/g, '')
                        .replace(/}/g, '')
                        .trim()
                        .replace(/\n/g, '<br>'),
                      shape: 'circlepin',
                      fillColor: getPnlColor(pnl),
                    });
                  });
                }
              });

              Highcharts.stockChart('BacktestChart', {
